<!DOCTYPE html>
<html lang="fa" dir="auto">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="icon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="mobile.css" media="(hover: none) and (pointer: coarse)">
    <title>کلمه 5 حرف حدس زن</title>
    <script src="shared js.js"></script>
    <script>
        if (localStorage.getItem("money-g") == null || localStorage.getItem("words-g") == null) {
            localStorage.setItem("cache-g", "welcome");
            window.location.href = 'welcome.html';
        } else {
            localStorage.removeItem("cache-g");
        }
    </script>
</head>

<body>
    <img src="icon.png">
    <p>________________________</p>
    <h1>کلمه 5 حرف حدس زن</h1>
    <p id="money"></p>
    <p id="words"></p>
    <button onclick="WordMGR()">مدیر کلمات داخلی</button>
    <br><br>
    <button onclick="oldWord()">بازی با کلمه ی ذخیره شده</button>
    <br><br>
    <button onclick="WordInInternet()">بازی با کلمه ی به روز</button>
    <br><br>
    <button onclick="reset()">ریست</button>
    <script>
        MAW();
        function WordMGR() {
            localStorage.setItem("cache-g", "WordMGR");
            window.location.href = 'word mgr.html';
        }
        function oldWord() {
            if (words >= 3) {
                localStorage.setItem("cache-g", "chooseWord");
                window.location.href = 'word mgr.html';
            } else {
                alert("در بازی باید بیشتر از 3 کلمه باشد تا شما بازی با کلمه ی قدیمی کنید.");
            }
        }
        function WordInInternet() {
            if (navigator.onLine) {
                localStorage.setItem("cache-g", "getWordInGithub");
                window.location.href = 'word mgr int.html';
            } else {
                alert("شما اینترنت ندارید.");
            }
        }
        function reset() {
            localStorage.setItem("cache-g", "reset");
            window.location.href = 'reset.html';
        }
    </script>
</body>

</html>
