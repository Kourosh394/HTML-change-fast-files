<!DOCTYPE html>
<html lang="fa" dir="auto">

<head>
    <meta charset="UTF-8">
    <title>ریست</title>
    <link rel="icon" href="icon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="mobile.css" media="(hover: none) and (pointer: coarse)">
    <script>
        if (localStorage.getItem("cache-g") != "reset") {
            localStorage.removeItem("cache-g");
            window.location.href = 'main.html';
        }
    </script>
</head>

<body>
    <h1>آیا میخواهید بازی را ریست کنید؟ چون کار ریست پاک کردن اطلاعات بازی است اما خود بازی نه.</h1>
    <br>
    <button onclick="reset()">بله</button>
    <button onclick="window.location.href = 'main.html'">برگشت</button>
    <script src="shared js.js"></script>
    <script>
        function reset() {
            let counter = 0;
            while (words >= counter) {
                localStorage.removeItem(`W${counter}-g`);
                counter++;
            }
            localStorage.removeItem("words-g");
            localStorage.removeItem("money-g");
            localStorage.removeItem("cache-g");
            alert("انجام شد. اما برای دیدن ببندید و دوباره باز کنید.");
        }
    </script>
</body>

</html>
